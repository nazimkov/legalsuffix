[project]
name = "legalsuffix"
version = "0.0.1b5"
description = "Detect, normalize, and strip legal entity suffixes."
keywords = ["legal entities", "company names", "legal suffixes", "name normalization", "elf code"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Slava Nazimkov" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/nazimkov/legalsuffix"
Documentation = "https://github.com/nazimkov/legalsuffix/blob/main/README.md"
Changelog = "https://github.com/nazimkov/legalsuffix/blob/main/CHANGELOG.md"
"Source code" = "https://github.com/nazimkov/legalsuffix"
Issues = "https://github.com/nazimkov/legalsuffix/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legalsuffix = ["data/*.csv"]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.12.4",
    "pyright>=1.1.403",
    "coverage>=7.17.2",
]


[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/htmlcov",
    "**/.pytest_cache"
]
pythonVersion = "3.12"
typeCheckingMode = "basic"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
