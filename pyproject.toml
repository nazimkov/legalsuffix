[project]
name = "legalsuffix"
version = "0.0.1b4"
description = "Detect, normalize, and strip legal entity suffixes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legalsuffix = ["data/*.csv"]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.12.4",
    "pyright>=1.1.403",
    "coverage>=7.17.2",
]


[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/htmlcov",
    "**/.pytest_cache"
]
pythonVersion = "3.12"
typeCheckingMode = "basic"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
